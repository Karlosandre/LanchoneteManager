name: lanchonete_app
description: Sistema de Gestão de Produção para Lanchonete
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  iconsax: ^0.0.8
  fl_chart: ^0.66.2
  
  # State Management
  provider: ^6.1.1
  
  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Auth & Storage
  shared_preferences: ^2.2.2
  crypto: ^3.0.3
  http: ^1.1.0
  
  # Email
  url_launcher: ^6.2.2
  
  # Utils
  uuid: ^4.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: true
  ios: true
  image_path: assets/logo.jpg

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
